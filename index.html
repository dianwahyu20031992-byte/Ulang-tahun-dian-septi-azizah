<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekan kejutan kecil disini</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>

  <div style="position: fixed; top: 15px; right: 15px; z-index: 999;">
    <audio id="bg-music" loop controls style="height: 32px; width: 130px; opacity: 0.85;">
      <source src="musik.mp3" type="audio/mpeg">
      Browser kamu tidak mendukung pemutar audio.
    </audio>
  </div>

  <div class="container">
    <div id="screen-1" class="screen active">
      <h2 class="subtitle">kejutan kecil</h2>
      <h1 class="title">hanya untukmu</h1>
      <button class="btn" onclick="goToScreen(2)">Open Your Surprise ✨</button>
    </div>

    <div id="screen-2" class="screen">
      <p class="desc">Sebelum lanjut aku ingin tau kamu sayang aku berapa persen</p>
      <div class="counter"><span id="percent">0</span>% <span id="emoji">🤬</span></div>
      
      <div id="heart-btn" class="heart-box">
        <div class="heart-icon">❤️</div>
        <span>Klik dan tahan</span>
      </div>

      <button id="next-to-gallery" class="btn hidden" onclick="goToScreen(3)">lanjut ➔</button>
    </div>

    <div id="screen-3" class="screen">
      <h2 class="title-script">Our Memories</h2>
      <p class="sub-desc">Klik foto untuk melihat pesan</p>

      <div class="gallery-grid">
        <div class="card" onclick="openPopup('Senyummu', 'Entah kenapa ya, tiap lihat kamu senyum rasanya moodku langsung ikut bagus.', 'foto1.jpg')">
          <img src="foto1.jpg" alt="Memory 1">
        </div>
        <div class="card" onclick="openPopup('Nyaman', 'Kalau lagi sama kamu rasanya tenang aja. Bisa jadi diri sendiri.', 'foto2.jpg')">
          <img src="foto2.jpg" alt="Memory 2">
        </div>
        <div class="card" onclick="openPopup('Tawamu', 'Aku paling suka denger kamu ketawa. Pelipur capek seharian.', 'foto3.jpg')">
          <img src="foto3.jpg" alt="Memory 3">
        </div>
        <div class="card" onclick="openPopup('Kamu', 'Semakin lama kenal kamu, semakin banyak hal kecil yang bikin aku sayang.', 'foto4.jpg')">
          <img src="foto4.jpg" alt="Memory 4">
        </div>
        <div class="card" onclick="openPopup('Momen Ini', 'Setiap detik yang dihabiskan bareng kamu itu berharga banget.', 'foto5.jpg')">
          <img src="foto5.jpg" alt="Memory 5">
        </div>
        <div class="card" onclick="openPopup('Favoritku', 'Foto ini selalu bikin aku tersenyum tiap kali ngeliatnya.', 'foto6.jpg')">
          <img src="foto6.jpg" alt="Memory 6">
        </div>
      </div>

      <button class="btn" style="margin-top: 20px;" onclick="goToScreen(4)">BUKA DISINI ➔</button>
    </div>

    <div id="screen-4" class="screen">
      <h1 class="hbd-title">Happy Birthday</h1>
      <h1 class="name-title">DIAN SEPTI AZIZAH</h1>
      
      <div class="message-box">
        <p id="typewriter-text"></p>
      </div>

      <button class="btn" onclick="location.reload()">↺ REPLAY</button>
    </div>
  </div>

  <div id="popup-modal" class="modal" onclick="closePopup()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closePopup()">&times;</span>
      <img id="popup-img" src="" alt="Detail">
      <h3 id="popup-title"></h3>
      <p id="popup-text"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
